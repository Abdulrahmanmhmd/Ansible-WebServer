- name: Web Server Deployment
  hosts: web_servers
  vars_files:
   - webserver2.yml
  tasks:


  # Task 1: Check RAM requirement
   - name: Verify system has enough RAM
     debug:
      msg: "System has {{ ansible_facts['memtotal_mb'] }} MB RAM"

   - name: Install webserver_package 
     ansible.builtin.package:
         name: "{{ webserver_package }}"
         state: present
     when: environment in ['production','staging']


   - name: Copy local file to remote
     ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/etc/nginx/conf.d/{{ item }}"
        owner: root
        group: root
        mode: '0644'
     loop: "{{ config_files }}"
     notify: restart webserver



   - name: Create virtual host configuration
     ansible.builtin.copy:
        content: |
          # Virtual Host Configuration for {{ item.server_name }}
          server {
              listen {{ item.port }};
              server_name {{ item.server_name }};
              root {{ item.document_root }};
              index index.html index.htm;
              
              location / {
                  try_files $uri $uri/ =404;
              }
              
              access_log /var/log/nginx/{{ item.server_name }}.access.log;
              error_log /var/log/nginx/{{ item.server_name }}.error.log;
          }
        dest: "/etc/nginx/sites-available/{{ item.server_name }}.conf"
        owner: root
        group: root
        mode: '0644'
     loop: "{{ virtual_hosts }}"
     notify: restart webserver


  handlers:
# Define your handler here
  - name: restart webserver
    service:
     name:"{{ webserver_service }}"
     state:restarted
      